<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SecEx — Vulnerability Extraction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,600;1,500&family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F0E6;
    --paper-raised: #FBFAF5;
    --ink: #1B2430;
    --ink-soft: #4A5568;
    --rule: #D9D3C0;
    --accent: #234E70;
    --sev-low: #6B7280;
    --sev-medium: #A6790F;
    --sev-high: #B3521C;
    --sev-critical: #9B2C2C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  .ribbon { height: 5px; background: var(--accent); }
  .wrap { max-width: 780px; margin: 0 auto; padding: 44px 24px 80px; }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 16px;
    margin-bottom: 8px;
  }
  .masthead h1 {
    font-family: 'Source Serif 4', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 30px;
    margin: 0;
    color: var(--ink);
  }
  .masthead a {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .masthead a:hover { border-bottom-color: var(--accent); }
  .subline {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin: 0 0 36px;
  }

  .field-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  textarea {
    width: 100%;
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 2px;
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    line-height: 1.65;
    padding: 14px;
    resize: vertical;
  }
  textarea::placeholder { color: #A8A296; }
  textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(35,78,112,0.14);
  }

  .intake-footer {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 14px;
    margin-bottom: 36px;
  }
  button.run {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper-raised);
    border: none;
    border-radius: 2px;
    padding: 11px 22px;
    cursor: pointer;
  }
  button.run:disabled { opacity: 0.45; cursor: default; }
  button.run:not(:disabled):hover { background: var(--accent); }
  .status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-soft);
  }

  .casefile { display: none; }
  .case-ref {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  .vuln-block {
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 20px 22px;
  }
  .vuln-block + .vuln-block { margin-top: 14px; }

  .casefile-header {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 14px;
  }
  .sev-stamp {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 2px;
    color: #fff;
  }
  .av-pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 2px;
    border: 1px solid var(--rule);
    color: var(--ink-soft);
  }
  .cve-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    margin-left: auto;
  }
  .cwe-line {
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .impact {
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--ink);
    margin-bottom: 14px;
  }
  .remediation {
    font-size: 13.5px;
    line-height: 1.6;
    color: #1F4A34;
    border-left: 3px solid #3C7A57;
    padding: 8px 0 8px 14px;
    margin-bottom: 14px;
  }
  .remediation .lbl {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #3C7A57;
    margin-bottom: 3px;
  }
  .products { display: flex; flex-wrap: wrap; gap: 6px; }
  .product-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    background: var(--paper);
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    padding: 3px 8px;
    border-radius: 2px;
  }
  .no-products {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #A8A296;
    font-style: italic;
  }

  .redacted-line {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
  }
  .redacted-bar {
    background: var(--ink);
    color: var(--ink);
    padding: 1px 10px;
    border-radius: 1px;
    user-select: none;
  }
  .redacted-note {
    color: var(--sev-critical);
    font-size: 11px;
    letter-spacing: 0.02em;
  }
  .redaction-log {
    display: none;
    margin-bottom: 16px;
    padding: 14px 16px;
    border: 1px dashed var(--ink-soft);
  }
  .redaction-log .stamp {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--sev-critical);
    margin: 0 0 10px;
  }

  details { margin-top: 18px; }
  summary {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    cursor: pointer;
  }
  pre {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    padding: 12px;
    border-radius: 2px;
    margin-top: 10px;
    overflow-x: auto;
  }

  .error-box {
    display: none;
    background: #FBEAEA;
    border: 1px solid var(--sev-critical);
    color: #7A2020;
    border-radius: 2px;
    padding: 14px 18px;
    font-size: 13.5px;
  }
</style>
</head>
<body>
<div class="ribbon"></div>
<div class="wrap">

  <div class="masthead">
    <h1>SecEx</h1>
    <a href="review.html">Label review tool →</a>
  </div>
  <p class="subline">Vulnerability extraction · Qwen2.5-3B fine-tuned via QLoRA</p>

  <p class="field-label">Advisory intake</p>
  <textarea id="input-text" rows="9" placeholder="Paste a CVE description, GHSA advisory, or vendor security bulletin..."></textarea>
  <div class="intake-footer">
    <button class="run" id="extract-btn">Run extraction</button>
    <span class="status" id="status-text"></span>
  </div>

  <div class="casefile" id="casefile">
    <p class="case-ref" id="case-ref"></p>

    <div class="redaction-log" id="redaction-log">
      <p class="stamp">Unverified details removed</p>
      <div id="redaction-list"></div>
    </div>

    <div id="vulns-container"></div>

    <details>
      <summary>Raw JSON</summary>
      <pre id="raw-json"></pre>
    </details>
  </div>

  <div class="error-box" id="error-box"></div>

</div>

<script>
const API_BASE = "http://localhost:8000";

const sevColor = {
  low: "var(--sev-low)",
  medium: "var(--sev-medium)",
  high: "var(--sev-high)",
  critical: "var(--sev-critical)",
};

function renderVuln(vuln) {
  const color = sevColor[vuln.severity] || "var(--sev-low)";
  const products = (vuln.affected_products || []).length
    ? vuln.affected_products.map(p =>
        `<span class="product-chip">${p.vendor}/${p.product}${p.version_range ? ' ' + p.version_range : ''}</span>`
      ).join("")
    : '<span class="no-products">no specific product identified in source text</span>';

  return `
    <div class="vuln-block">
      <div class="casefile-header">
        <span class="sev-stamp" style="background:${color}">${vuln.severity}</span>
        <span class="av-pill">${vuln.attack_vector}</span>
        ${vuln.cve_id ? `<span class="cve-tag">${vuln.cve_id}</span>` : '<span class="cve-tag">no CVE assigned</span>'}
      </div>
      <div class="cwe-line">${vuln.cwe_category || 'Uncategorized'}</div>
      <div class="impact">${vuln.impact_summary}</div>
      ${vuln.remediation_action ? `<div class="remediation"><span class="lbl">Remediation</span>${vuln.remediation_action}</div>` : ''}
      <div class="products">${products}</div>
    </div>
  `;
}

function renderRedactions(warnings) {
  return warnings.map(w => {
    const match = w.match(/\('([^']+)'\)/);
    const value = match ? match[1] : "value";
    return `
      <div class="redacted-line">
        <span class="redacted-bar">${value.replace(/./g, '\u2588')}</span>
        <span class="redacted-note">${w}</span>
      </div>
    `;
  }).join("");
}

document.getElementById("extract-btn").addEventListener("click", async () => {
  const inputText = document.getElementById("input-text").value.trim();
  const statusText = document.getElementById("status-text");
  const casefile = document.getElementById("casefile");
  const redactionLog = document.getElementById("redaction-log");
  const errorBox = document.getElementById("error-box");
  const btn = document.getElementById("extract-btn");

  if (!inputText) return;

  casefile.style.display = "none";
  redactionLog.style.display = "none";
  errorBox.style.display = "none";
  btn.disabled = true;
  statusText.textContent = "Running extraction — typically 10-30s...";

  try {
    const res = await fetch(`${API_BASE}/extract`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ input_text: inputText }),
    });
    const data = await res.json();

    if (!data.success) {
      errorBox.textContent = `Extraction failed: ${data.error || 'unknown error'}`;
      errorBox.style.display = "block";
      return;
    }

    const now = new Date();
    document.getElementById("case-ref").textContent =
      `Ref. SECEX-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;

    const vulns = data.extraction.vulnerabilities || [];
    document.getElementById("vulns-container").innerHTML = vulns.map(renderVuln).join("");
    document.getElementById("raw-json").textContent = JSON.stringify(data.extraction, null, 2);

    if (data.groundedness_warnings && data.groundedness_warnings.length > 0) {
      document.getElementById("redaction-list").innerHTML = renderRedactions(data.groundedness_warnings);
      redactionLog.style.display = "block";
    }

    casefile.style.display = "block";
  } catch (err) {
    errorBox.textContent = `Request failed: ${err.message}`;
    errorBox.style.display = "block";
  } finally {
    btn.disabled = false;
    statusText.textContent = "";
  }
});
</script>
</body>
</html>
